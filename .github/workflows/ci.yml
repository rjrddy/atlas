name: Atlas gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make setup lint test web scan
      - run: docker build -t atlas:test .
      - run: python3 scripts/container_smoke.py
  sanitizer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: make ${{ matrix.kind }}
