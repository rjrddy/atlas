name: Atlas gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make setup lint test web scan
      - run: docker build -t atlas:test .
      - run: python3 scripts/container_smoke.py
      - run: .venv/bin/pip install -r requirements-browser.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium ffmpeg
      - run: PYTHONPATH=build:sdk .venv/bin/python scripts/review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-runtime-evidence
          path: docs/results/
  sanitizer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: make ${{ matrix.kind }}
