syntax = "proto3";
package atlas;
service Search { rpc Query(QueryRequest) returns (QueryResponse); }
message QueryRequest { repeated float vector = 1; uint32 k = 2; uint32 effort = 3; string algorithm = 4; int32 tag = 5; }
message Neighbor { uint32 id = 1; float squared_l2 = 2; }
message QueryResponse { repeated Neighbor neighbors = 1; double elapsed_ms = 2; string path = 3; }
